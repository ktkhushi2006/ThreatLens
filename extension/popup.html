<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">ThreatLens</h1>
    </div>

    <div class="url-section">
      <p class="label">Current Website:</p>
      <div class="url-display" id="url-display">Loading...</div>
    </div>

    <div id="action-section">
      <button id="analyze-btn" class="btn">Analyze Current URL</button>
    </div>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p>Analyzing...</p>
    </div>

    <div id="result-section" class="hidden">
      <div class="score-card">
        <div class="score" id="risk-score">--</div>
        <div class="score-label">/ 100 Risk Score</div>
        <div class="risk-badge" id="risk-badge">-- RISK</div>
      </div>

      <div class="findings-container">
        <p class="label">Key Findings:</p>
        <ul id="findings-list"></ul>
      </div>
      
      <div id="warning-banner" class="hidden banner">
        <span class="icon">⚠️</span>
        <div>
          <strong>THREAT DETECTED</strong>
          <p>This website may be unsafe.</p>
        </div>
      </div>
      
      <div id="safe-banner" class="hidden banner safe">
        <span class="icon">✓</span>
        <div>
          <strong>LOW RISK</strong>
          <p>No significant indicators.</p>
        </div>
      </div>

      <button id="view-report-btn" class="btn outline">View Full Report</button>
    </div>

    <div id="error-section" class="hidden">
      <p id="error-msg" class="error"></p>
      <button id="retry-btn" class="btn outline mt">Retry</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
